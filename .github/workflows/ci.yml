name: Check and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check
      - run: just build
      - uses: actions/upload-artifact@v4
        with:
          name: matchup-lookup-windows
          path: matchup-lookup.exe
