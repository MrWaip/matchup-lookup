name: Check and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # publish the nightly release from main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: just check
      - run: just check-js
      - run: just build
      - run: just build-gui
      - uses: actions/upload-artifact@v4
        with:
          name: matchup-lookup-windows
          path: |
            matchup-lookup.exe
            cmd/matchup-gui/build/bin/matchup-lookup-gui.exe
      # A rolling release keeps a fixed download URL for the newest main build:
      # https://github.com/MrWaip/matchup-lookup/releases/download/nightly/<file>
      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f nightly
          git push -f origin nightly
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --title "Latest build" --notes ""
          gh release edit nightly --notes "Latest build of main: ${GITHUB_SHA::7}, $(date -u +%Y-%m-%d)."
          gh release upload nightly --clobber matchup-lookup.exe cmd/matchup-gui/build/bin/matchup-lookup-gui.exe
