version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: store
        out: internal/store
        output_files_suffix: _gen
        output_db_file_name: db_gen.go
        output_models_file_name: models_gen.go
        emit_empty_slices: true
